name: zizmor

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Assert scan targets exist
        # This repo already learned this lesson once with actionlint, which
        # silently exits 0 when handed a directory with nothing in it. zizmor
        # is handed a directory too (.github/workflows), so verify up front
        # that there is actually something in it to scan, rather than trusting
        # a green run to mean anything was checked.
        run: |
          set -euo pipefail
          n=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)
          echo "workflow files found: ${n}"
          if [ "${n}" -eq 0 ]; then
            echo "::error::no workflow files found under .github/workflows — zizmor would silently scan nothing"
            exit 1
          fi
          if [ ! -f action.yml ]; then
            echo "::error::action.yml not found — zizmor would silently scan nothing"
            exit 1
          fi

      - name: Audit workflows for injection and supply-chain issues
        # Pinned by digest, not the mutable :1.30.0 tag, so the audit can't
        # silently start running a different image. Resolved via
        # `docker buildx imagetools inspect ghcr.io/zizmorcore/zizmor:1.30.0`.
        #
        # The "targets exist" step above only proves there was something to
        # scan on the host filesystem — it says nothing about whether zizmor
        # actually scanned it. zizmor logs an INFO "completed <file>" line
        # per input it finishes auditing (confirmed against v1.30.0), so
        # capture its output and assert that count is nonzero: the gate must
        # not be able to pass by scanning nothing.
        run: |
          set -o pipefail
          # 1.30.0
          docker run --rm -v "$PWD:/repo" ghcr.io/zizmorcore/zizmor@sha256:1ba0035c343f50e85fde29beb0d78e4db448eaa0c762a11a09805d241424ee03 \
            --persona regular --format plain /repo/.github/workflows /repo/action.yml 2>&1 | tee /tmp/zizmor.out
          completed=$(grep -c 'completed ' /tmp/zizmor.out || true)
          echo "files completed by zizmor: ${completed}"
          if [ "${completed}" -eq 0 ]; then
            echo "::error::zizmor reported zero completed files — the scan did not actually check anything"
            exit 1
          fi
