name: tag-release

on:
  release:
    types:
      - published

jobs:
  tag-release:
    if: github.repository_owner != 'docker'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        # zizmor: ignore[artipacked] "Update floating major tag" below needs the persisted default token to push; this job uploads no artifacts.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      -
        name: Update floating major tag
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG_NAME}"
          MAJOR="v$(echo "${VERSION#v}" | cut -d. -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${MAJOR}" "${VERSION}^{}"
          git push origin "${MAJOR}" --force
