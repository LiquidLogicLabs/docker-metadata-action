name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 10 * * *'
  push:
    branches:
      - 'master'
      - 'releases/v*'
    tags:
      - 'v*.*.*'
  pull_request:

env:
  DOCKER_IMAGE: localhost:5000/name/app
  BUILDX_VERSION: latest

jobs:
  fork-invariants:
    # Upstream's own validate.yml gates everything behind `repository_owner ==
    # 'docker'`, so on this fork none of lint/typecheck/vendor-check/dist-parity
    # ever ran on a PR. This job intentionally does NOT copy that gate — it must
    # run for this repository, on every pull request and every push to master.
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Setup Node.js
        # zizmor: ignore[cache-poisoning] cache is explicitly disabled (`cache: ''`
        # below) precisely because this job runs on pull_request; nothing this
        # job produces is uploaded, published, or consumed by any other job.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: ''
      -
        name: Install
        run: yarn install --immutable
      -
        name: Lint
        run: yarn lint
      -
        name: Typecheck
        run: yarn tsc --noEmit
      -
        name: Vendored files match upstream
        run: yarn check:vendored
      -
        name: Build
        run: yarn build
      -
        name: Test
        run: yarn test
      -
        name: dist is committed (parity)
        run: git diff --exit-code dist/index.js
      -
        name: dist purity invariant
        run: |
          set -euo pipefail
          fail=0
          for pat in "octokit\|Octokit\|rest\.repos\|rest\.git\|graphql\|@octokit" \
                     "actions-toolkit\|actions/github" \
                     "api\.github\.com"; do
            n=$(grep -c "${pat}" dist/index.js || true)
            echo "pattern '${pat}' -> ${n}"
            [ "${n}" = "0" ] || fail=1
          done
          if [ "${fail}" != "0" ]; then
            echo "::error::dist/index.js contains GitHub API fingerprints. The fork's core property is broken."
            exit 1
          fi

  context:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context:
          - workflow
          - git
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          context: ${{ matrix.context }}

  multi-images:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
      -
        name: Print envs
        run: env|sort

  tag-schedule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag-schedule:
          - ""
          - "cron-{{date 'YYYYMMDD'}}"
          - "{{date 'YYYYMMDD-HHmmss'}}"
          - "schedule"
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          tags: |
            type=schedule,pattern=${{ matrix.tag-schedule }}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

  tag-match:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag-match: '\d.\d.\d'
            tag-match-group: '0'
          - tag-match: '\d.\d'
            tag-match-group: '0'
          - tag-match: 'v(.*)'
            tag-match-group: '1'
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=match,"pattern=${{ matrix.tag-match }}",group=${{ matrix.tag-match-group }}
            type=sha

  tag-semver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor-latest:
          - "auto"
          - "true"
          - "false"
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=sha
          flavor: |
            latest=${{ matrix.flavor-latest }}

  flavor:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          flavor: |
            prefix=foo-
            suffix=-bar

  images:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            name=${{ env.DOCKER_IMAGE }}
            name=ghcr.io/name/app,enable=${{ github.event_name == 'pull_request' }}
            name=ghcr.io/name/release,enable=${{ startsWith(github.ref, 'refs/tags/') }}

  custom-labels-annotations:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          labels: |
            maintainer=CrazyMax
            org.opencontainers.image.title=MyCustomTitle
            org.opencontainers.image.description=this is a "good" example
            org.opencontainers.image.vendor=MyCompany
          annotations: |
            maintainer=Foo
            org.opencontainers.image.title=MyFooTitle
            org.opencontainers.image.description=this is a "foo" example
            org.opencontainers.image.vendor=MyFooCompany

  global-exps:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          labels: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
          tags: |
            type=sha
            type=raw,value=gexp-branch-{{branch}}
            type=raw,value=gexp-date-{{date 'YYYYMMDD'}}
            type=raw,value=gexp-tag-{{tag}}
            type=raw,value=gexp-baseref-{{base_ref}}
            type=raw,value=gexp-defbranch,enable={{is_default_branch}}
            type=raw,value=gexp-notdefbranch,enable={{is_not_default_branch}}

  json:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        id: meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          labels: |
            maintainer=CrazyMax
      -
        name: JSON output
        env:
          META_MAINTAINER: ${{ fromJSON(steps.meta.outputs.json).labels['maintainer'] }}
          META_VERSION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          META_REVISION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          META_CREATED: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
        run: |
          echo "maintainer=${META_MAINTAINER}"
          echo "version=${META_VERSION}"
          echo "revision=${META_REVISION}"
          echo "created=${META_CREATED}"

  docker-push:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: network=host
      -
        name: Docker meta
        id: docker_meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha
      -
        name: Build and push to local registry
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./test
          file: ./test/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/386
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
      -
        name: Inspect image
        env:
          META_VERSION: ${{ steps.docker_meta.outputs.version }}
        run: |
          docker pull "${DOCKER_IMAGE}:${META_VERSION}"
          docker image inspect "${DOCKER_IMAGE}:${META_VERSION}"
      -
        name: Check manifest
        env:
          META_VERSION: ${{ steps.docker_meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${DOCKER_IMAGE}:${META_VERSION}"

  bake:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
      -
        name: Docker meta
        id: docker_meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      -
        name: Build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          files: |
            ./test/docker-bake.hcl
            cwd://${{ steps.docker_meta.outputs.bake-file-tags }}
            cwd://${{ steps.docker_meta.outputs.bake-file-labels }}
          targets: |
            release

  sep-tags:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sep:
          - " "
          - ","
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        id: meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          sep-tags: ${{ matrix.sep }}
      -
        name: Tags
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        with:
          script: |
            console.log(process.env.META_TAGS);

  output-env:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        id: meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          labels: |
            maintainer=CrazyMax
          annotations: |
            maintainer=Foo
      -
        name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./test
          file: ./test/output.Dockerfile
          build-args: |
            DOCKER_METADATA_OUTPUT_VERSION
            DOCKER_METADATA_OUTPUT_TAGS
            DOCKER_METADATA_OUTPUT_LABELS
            DOCKER_METADATA_OUTPUT_ANNOTATIONS
            DOCKER_METADATA_OUTPUT_JSON

  no-output-env:
    runs-on: ubuntu-latest
    env:
      DOCKER_METADATA_SET_OUTPUT_ENV: false
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Docker meta
        id: meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          labels: |
            maintainer=CrazyMax
          annotations: |
            maintainer=Foo
      -
        name: No output environment variables set
        shell: bash
        run: |
          [[ "$(printenv | grep "^DOCKER_METADATA_OUTPUT_" | wc -l)" -eq 0 ]] || exit 1

  bake-annotations:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
      -
        name: Docker meta
        id: docker_meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      -
        name: Build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          files: |
            ./test/docker-bake.hcl
            cwd://${{ steps.docker_meta.outputs.bake-file-tags }}
            cwd://${{ steps.docker_meta.outputs.bake-file-annotations }}
          targets: |
            release

  no-images:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
      -
        name: Print envs
        run: env|sort

  bake-path-context:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: latest
      -
        name: Docker meta
        id: docker_meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
      -
        name: Build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          files: |
            ./test/docker-bake.hcl
            ${{ steps.docker_meta.outputs.bake-file-tags }}
            ${{ steps.docker_meta.outputs.bake-file-labels }}
          targets: |
            release

  sha-short:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        short-length:
          - ''
          - 16
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
      -
        name: Docker meta
        uses: ./ # zizmor: ignore[self-repository] act 0.2.89 (used for local CI via test:act:ci) does not support the $/ self-repository syntax yet; verified it fails to parse
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/name/app
          tags: |
            type=sha
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: ${{ matrix.short-length }}

  dump:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      -
        name: Dump context
        uses: crazy-max/ghaction-dump-context@5355a8e5e6ac5a302e746a1c4b7747a0393863c8 # v2
