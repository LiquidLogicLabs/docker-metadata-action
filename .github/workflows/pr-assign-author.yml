name: pr-assign-author

permissions:
  contents: read

on: # zizmor: ignore[dangerous-triggers] no checkout of PR code occurs; the called reusable workflow only assigns the PR author as assignee via the API.
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  run:
    uses: crazy-max/.github/.github/workflows/pr-assign-author.yml@1b673f36fad86812f538c1df9794904038a23cbf
    permissions:
      contents: read
      pull-requests: write
