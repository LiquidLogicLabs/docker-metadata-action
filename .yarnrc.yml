compressionLevel: mixed

enableGlobalCache: false

enableHardenedMode: true

enableScripts: false

logFilters:
  - code: YN0013
    level: discard
  - code: YN0019
    level: discard
  - code: YN0076
    level: discard

nodeLinker: node-modules

npmMinimalAgeGate: 2d

yarnPath: .yarn/releases/yarn-4.18.0.cjs
